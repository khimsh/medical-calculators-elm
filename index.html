<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="password=no" />
    <title>Medical calculators</title>
    <script>
      // Set base href only on GitHub Pages
      if (window.location.hostname === "khimsh.github.io") {
        document.write('<base href="/medical-calculators-elm/" />');
      }
    </script>
    <link rel="preload" href="fonts/FiraGO-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="elm-app"></div>

    <script src="elm-app.js"></script>
    <script>
      // Favorites are stored as a JSON list of calculator keys; Elm ignores anything invalid
      var storedFavorites = null;
      try {
        storedFavorites = JSON.parse(localStorage.getItem("favorites"));
      } catch (e) {}

      var app = Elm.Main.init({
        node: document.getElementById("elm-app"),
        flags: storedFavorites,
      });

      // Subscribe to the setLangAttribute port to update the html lang attribute
      if (app.ports && app.ports.setLangAttribute) {
        app.ports.setLangAttribute.subscribe(function (lang) {
          document.documentElement.setAttribute("lang", lang);
        });
      }

      // Subscribe to the saveFavorites port to persist favorites (storage can throw in private mode)
      if (app.ports && app.ports.saveFavorites) {
        app.ports.saveFavorites.subscribe(function (favorites) {
          try {
            localStorage.setItem("favorites", JSON.stringify(favorites));
          } catch (e) {}
        });
      }
    </script>
  </body>
</html>
